name: Validación de API y dependencias

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Instalar versiones fijadas
        run: npm ci
      - name: Verificar casos y detector de incompatibilidad
        run: npm run verify
      - name: Revisar vulnerabilidades (bloquea avisos moderados o superiores)
        run: npm audit --audit-level=moderate
      - name: Conservar únicamente informes sanitizados
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidencia-validacion
          path: |
            evidence/01-base.json
            evidence/01-base.txt
            evidence/02-fallo-controlado.json
            evidence/02-fallo-controlado.txt
            evidence/03-corregida.json
            evidence/03-corregida.txt
            evidence/resumen.json
          if-no-files-found: error
          retention-days: 14

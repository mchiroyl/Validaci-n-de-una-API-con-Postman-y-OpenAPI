name: Validación de API y dependencias

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: API y contrato — 12 casos
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Instalar versiones fijadas
        run: npm ci
      - name: Verificar casos y detector de incompatibilidad
        run: npm run verify
      - name: Conservar únicamente informes sanitizados
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: evidencia-validacion
          path: |
            evidence/01-base.json
            evidence/01-base.txt
            evidence/02-fallo-controlado.json
            evidence/02-fallo-controlado.txt
            evidence/03-corregida.json
            evidence/03-corregida.txt
            evidence/resumen.json
          if-no-files-found: error
          retention-days: 14

  auditoria:
    name: Seguridad de dependencias
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - name: Bloquear vulnerabilidades moderadas o superiores
        run: npm audit --audit-level=moderate
